version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres
    environment:
      POSTGRES_DB: orderflow_db
      POSTGRES_USER: orderflow_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - orderflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow_user -d orderflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  orderflow_pgdata: