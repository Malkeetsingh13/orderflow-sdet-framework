server:
  port: 8080

spring:
  application:
    name: orderflow-backend

  datasource:
    # Runs embedded PostgreSQL-mode database stored in a local file (no Docker required!)
    url: jdbc:h2:file:./data/orderflow_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: orderflow_user
    password: secretpassword
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
  expiration-ms: 86400000